<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Comic+Relief&family=Anton&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  body.mono  { font-family: 'JetBrains Mono', monospace; }
  body.comic { font-family: 'Comic Relief', 'Comic Sans MS', cursive; }
  body.impact { font-family: 'Anton', 'Impact', sans-serif; letter-spacing: .03em; }

  #bsod {
    position: fixed; inset: 0; color: #fff; padding: 8vh 8vw;
    display: flex; flex-direction: column; justify-content: flex-start;
    white-space: pre-wrap; line-height: 1.5;
  }
  #face { font-size: 6em; font-weight: 300; margin-bottom: .15em; line-height: 1; }
  #msg  { font-weight: 300; }
  #code { margin-top: 1.2em; opacity: .85; font-size: .8em; }
  #prog { margin-top: 1.5em; opacity: .9; }

  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
  .blinking #face, .blinking #msg { animation: blink 1s step-start infinite; }

  @keyframes shake {
    0%,100% { transform: translate(0,0) } 20% { transform: translate(-6px,3px) }
    40% { transform: translate(5px,-4px) } 60% { transform: translate(-4px,-2px) }
    80% { transform: translate(4px,4px) }
  }
  @keyframes flicker { 0%,100% { filter: brightness(1) } 50% { filter: brightness(1.25) } }
  .creepy { animation: shake .35s infinite, flicker .8s infinite; }

  #reveal {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%) scale(0);
    background: #fff; color: #111; padding: 30px 50px; border-radius: 20px;
    font-size: 32px; font-weight: 800; text-align: center; z-index: 10;
    transition: transform .5s cubic-bezier(.2,1.6,.4,1); box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  #reveal.show { transform: translate(-50%,-50%) scale(1); }
  #reveal small { display: block; font-size: 14px; font-weight: 400; margin-top: 8px; color: #555; }

  #hint {
    position: fixed; bottom: 12px; right: 16px; font-size: 11px; opacity: .35;
    color: #fff; z-index: 5; user-select: none;
  }
</style>
</head>
<body>
<div id="bsod">
  <div id="face">:(</div>
  <div id="msg"></div>
  <div id="code"></div>
  <div id="prog"></div>
</div>
<div id="reveal">😂 РОЗЫГРЫШ!<small>Это шуточный экран. Ничего не сломалось 🙂<br>Нажми Esc, чтобы выйти</small></div>
<div id="hint">шуточный экран · это не настоящая ошибка</div>

<script>
// ---------- 1. Расшифровка параметров ----------
function decodeParams(hash) {
  try {
    const reversed = hash.split('').reverse().join('');
    const b64 = reversed.replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch (e) { return null; }
}

const P = decodeParams(location.hash.slice(1));
const bsod = document.getElementById('bsod');

if (!P) {
  document.getElementById('msg').textContent =
    'Проблема: ссылка повреждена или параметры утеряны.\n\nЗайди в конструктор и сгенерируй ссылку заново.';
} else {
  // ---------- 2. Применение параметров ----------
  bsod.style.background = P.c || '#0078D7';
  document.body.classList.add(P.f === 'mono' ? 'mono' : P.f === 'comic' ? 'comic' : P.f === 'impact' ? 'impact' : '');
  const fs = P.fs || 24;
  bsod.style.fontSize = fs + 'px';
  if (P.blk) bsod.classList.add('blinking');
  if (P.creepy) bsod.classList.add('creepy');

  if (P.face === false) document.getElementById('face').style.display = 'none';
  else if (P.t && P.t.h) document.getElementById('face').textContent = P.t.h;

  document.getElementById('msg').textContent = (P.t && P.t.body) || 'Неизвестная ошибка.';

  const codeEl = document.getElementById('code');
  if (P.code) codeEl.textContent = 'Код ошибки: ' + P.code;
  else codeEl.style.display = 'none';

  // ---------- 3. Счётчик прогресса ----------
  if (P.prog !== false) {
    const progEl = document.getElementById('prog');
    let pct = 0;
    const tick = () => {
      pct += (P.spd || 3);
      if (pct >= 100) { pct = 100; }
      progEl.textContent = pct + '% завершено';
      if (pct < 100) setTimeout(tick, 400);
    };
    tick();
  }

  // ---------- 4. Полноэкранный режим ----------
  // ВАЖНО: браузеры требуют действия пользователя для Fullscreen API.
  // Поэтому ловим ПЕРВЫЙ клик/клавишу — и тогда уходим в полный экран.
  let fsTried = false;
  function goFullscreen() {
    if (fsTried) return;
    fsTried = true;
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(()=>{});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    // На iPhone Safari полноэкранного API для веб-страниц нет —
    // вместо этого прячем панели браузера максимально:
    window.scrollTo(0, 1);
  }
  ['click','keydown','touchstart'].forEach(ev =>
    window.addEventListener(ev, goFullscreen, { once: false, passive: true }));

  // ---------- 5. Звук (WebAudio, без внешних файлов) ----------
  function playSound(type) {
    if (type === 'none') return;
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;

    const beep = (t0, freq, dur, vol = 0.3, typeW = 'square') => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = typeW; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(t0); o.stop(t0 + dur);
    };
    const noise = (t0, dur, vol = 0.25) => {
      const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      const s = ctx.createBufferSource(); s.buffer = buf;
      const g = ctx.createGain(); g.gain.value = vol;
      s.connect(g); g.connect(ctx.destination); s.start(t0);
    };

    switch (type) {
      case 'beep':   beep(now, 880, 0.35); break;
      case 'double': beep(now, 880, 0.25); beep(now + 0.35, 880, 0.25); break;
      case 'alarm':
        for (let i = 0; i < 6; i++) { beep(now + i * 0.5, 600, 0.22); beep(now + i * 0.5 + 0.22, 900, 0.22); }
        break;
      case 'scream':
        // синтезированный «крик»: быстрая модуляция высоты + шум
        beep(now, 1200, 1.2, 0.35, 'sawtooth');
        beep(now + 0.1, 900, 1.0, 0.3, 'sawtooth');
        noise(now, 1.2, 0.15);
        break;
      case 'glitch':
        for (let i = 0; i < 12; i++) noise(now + i * 0.12, 0.1, 0.2);
        break;
    }
  }

  let soundPlayed = false;
  function onGesture() {
    goFullscreen();
    if (!soundPlayed) {
      soundPlayed = true;
      playSound(P.snd || 'none');
    }
  }
  ['click','keydown','touchstart'].forEach(ev =>
    window.addEventListener(ev, onGesture, { passive: true }));

  // ---------- 6. Разоблачение ----------
  setTimeout(() => {
    document.getElementById('reveal').classList.add('show');
    if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  }, (P.rev || 15) * 1000);

  // Esc выходит из полного экрана автоматически (встроено в браузер)
}
</script>
</body>
</html>
