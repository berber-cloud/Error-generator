<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>…</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Comic+Relief&family=Anton&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; cursor: none }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  body.mono  { font-family: 'JetBrains Mono', monospace; }
  body.comic { font-family: 'Comic Relief', 'Comic Sans MS', cursive; }
  body.impact { font-family: 'Anton', 'Impact', sans-serif; letter-spacing: .03em; }

  #bsod {
    position: fixed; inset: 0; color: #fff; padding: 8vh 8vw;
    display: flex; flex-direction: column; justify-content: flex-start;
    white-space: pre-wrap; line-height: 1.5;
  }
  #face { font-size: 6em; font-weight: 300; margin-bottom: .15em; line-height: 1; }
  #msg  { font-weight: 300; }
  #code { margin-top: 1.2em; opacity: .85; font-size: .8em; }
  #prog { margin-top: 1.5em; opacity: .9; }

  @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
  .blinking #face, .blinking #msg { animation: blink 1s step-start infinite; }

  @keyframes shake {
    0%,100% { transform: translate(0,0) } 20% { transform: translate(-6px,3px) }
    40% { transform: translate(5px,-4px) } 60% { transform: translate(-4px,-2px) }
    80% { transform: translate(4px,4px) }
  }
  @keyframes flicker { 0%,100% { filter: brightness(1) } 50% { filter: brightness(1.25) } }
  .creepy { animation: shake .35s infinite, flicker .8s infinite; }
</style>
</head>
<body>
<div id="bsod">
  <div id="face">:(</div>
  <div id="msg"></div>
  <div id="code"></div>
  <div id="prog"></div>
</div>

<script>
// ---------- 1. Расшифровка параметров ----------
function decodeParams(hash) {
  try {
    const reversed = hash.split('').reverse().join('');
    const b64 = reversed.replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(escape(atob(b64)));
    return JSON.parse(json);
  } catch (e) { return null; }
}

const P = decodeParams(location.hash.slice(1));
const bsod = document.getElementById('bsod');

if (!P) {
  document.getElementById('msg').textContent =
    'Your PC ran into a problem that it couldn\'t handle, and now it needs to restart.';
} else {
  // ---------- 2. Применение параметров ----------
  bsod.style.background = P.c || '#0078D7';

  // FIX: пустой класс больше не добавляем — это ломало весь скрипт
  const fontClass = P.f === 'mono' ? 'mono' : P.f === 'comic' ? 'comic' : P.f === 'impact' ? 'impact' : null;
  if (fontClass) document.body.classList.add(fontClass);

  bsod.style.fontSize = (P.fs || 24) + 'px';
  if (P.blk) bsod.classList.add('blinking');
  if (P.creepy) bsod.classList.add('creepy');

  if (P.face === false) document.getElementById('face').style.display = 'none';
  else if (P.t && P.t.h) document.getElementById('face').textContent = P.t.h;

  document.getElementById('msg').textContent = (P.t && P.t.body) || 'Неизвестная ошибка.';

  const codeEl = document.getElementById('code');
  if (P.code) codeEl.textContent = 'Код ошибки: ' + P.code;
  else codeEl.style.display = 'none';

  // ---------- 3. Реалистичный счётчик прогресса ----------
  // Пресеты скорости: [задержка между шагами, макс. прирост за шаг]
  const SPEED = {
    slow:   { minDelay: 8000, maxDelay: 20000, maxInc: 3  }, // висит долго
    medium: { minDelay: 3000, maxDelay: 8000,  maxInc: 5  },
    fast:   { minDelay: 700,  maxDelay: 2000,  maxInc: 9  }
  };

  if (P.prog !== false) {
    const cfg = SPEED[P.spd] || SPEED.medium;
    const progEl = document.getElementById('prog');
    let pct = 0;

    const rand = (a, b) => a + Math.random() * (b - a);

    function tick() {
      if (pct < 100) {
        // Прирост: чаще маленький (1-2), редко — рывок до maxInc
        const inc = Math.random() < 0.7 ? rand(1, 2) : rand(2, cfg.maxInc);
        pct = Math.min(100, pct + inc);
        progEl.textContent = Math.floor(pct) + '% завершено';

        if (pct < 100) {
          // Случайная задержка + иногда «застревание» на долгие секунды
          let delay = rand(cfg.minDelay, cfg.maxDelay);
          if (Math.random() < 0.2) delay *= 2.5;
          setTimeout(tick, delay);
        }
      }
    }
    progEl.textContent = '0% завершено';
    setTimeout(tick, rand(1000, 2500));
  }

  // ---------- 4. Полноэкранный режим (после первого действия пользователя) ----------
  function goFullscreen() {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    window.scrollTo(0, 1);
  }
  ['click','keydown','touchstart'].forEach(ev =>
    window.addEventListener(ev, goFullscreen, { passive: true }));
}
</script>
</body>
</html>
